execute:
  common:
    postHook: tests/post.bash
  tests:
    hello:
      files:
        - tests/hello/program.hex
      tags: [ sanity ]
    cmark:
      files:
        - tests/cmark/program.hex
    dhry:
      files:
        - tests/dhry/program.hex

configurations:
  default:
    compile:
      verilogDefines:
        RTLMETER_FF_DELAY: "#1"
    execute:
      tests:
        cmark:
          args: [ +iterations=2 ]
          tags: [ standard ]
        dhry:
          args: [ +iterations=1500 ]

  nodelay:
    compile:
      verilogDefines:
        RTLMETER_FF_DELAY: ""
    execute:
      tests:
        cmark:
          args: [ +iterations=45 ]
        dhry:
          args: [ +iterations=34000 ]
