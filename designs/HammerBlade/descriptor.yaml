configurations:
  16x8:
    compile:
      verilogDefines:
        BSG_MACHINE_BARRIER_RUCHE_FACTOR_X: 3
        BSG_MACHINE_DRAM_BANK_SIZE_WORDS: 16777216
        BSG_MACHINE_DRAM_SIZE_WORDS: 536870912
        BSG_MACHINE_GLOBAL_X: 16
        BSG_MACHINE_GLOBAL_Y: 8
        BSG_MACHINE_HOST_X_CORD: 16
        BSG_MACHINE_IPOLY_HASHING: 1
        BSG_MACHINE_NETWORK_CFG: e_network_half_ruche_x
        BSG_MACHINE_NUM_VCACHES_PER_CHANNEL: 16
        BSG_MACHINE_ORIGIN_X_CORD: 16
        BSG_MACHINE_ORIGIN_Y_CORD: 8
        BSG_MACHINE_RUCHE_FACTOR_X: 3
        BSG_MACHINE_WH_RUCHE_FACTOR: 2
    execute:
      common:
        files: [tests/16x8/amoadd.nbf]
      tests:
        hello:
          args: [+nbf_file=amoadd.nbf, +num_finish=1, +iterations=1]
          tags: [sanity]
        amoadd:
          args: [+nbf_file=amoadd.nbf, +num_finish=1, +iterations=90]
          tags: [standard]
  2x1:
    compile:
      verilogDefines:
        BSG_MACHINE_BARRIER_RUCHE_FACTOR_X: 1
        BSG_MACHINE_DRAM_BANK_SIZE_WORDS: 4194304
        BSG_MACHINE_DRAM_SIZE_WORDS: 16777216
        BSG_MACHINE_GLOBAL_X: 2
        BSG_MACHINE_GLOBAL_Y: 1
        BSG_MACHINE_HOST_X_CORD: 2
        BSG_MACHINE_IPOLY_HASHING: 0
        BSG_MACHINE_NETWORK_CFG: e_network_mesh
        BSG_MACHINE_NUM_VCACHES_PER_CHANNEL: 2
        BSG_MACHINE_ORIGIN_X_CORD: 2
        BSG_MACHINE_ORIGIN_Y_CORD: 2
        BSG_MACHINE_RUCHE_FACTOR_X: 1
        BSG_MACHINE_WH_RUCHE_FACTOR: 1
    execute:
      common:
        files: [tests/2x1/amoadd.nbf]
      tests:
        hello:
          args: [+nbf_file=amoadd.nbf, +num_finish=1, +iterations=1]
          tags: [sanity]
        amoadd:
          args: [+nbf_file=amoadd.nbf, +num_finish=1, +iterations=60000]
          tags: [standard]
